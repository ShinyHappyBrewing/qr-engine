<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shiny Happy Guestbook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <style>
    :root {
      --blue: #00A9CE;
      --black: #0d0d0d;
      --black-alt: #161616;
      --white: #f3f3f3;
      --muted: rgba(255,255,255,.72);
      --gold: #f2bd55;
      --gold-dark: #65491d;
      --panel: rgba(255,255,255,.035);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      background: radial-gradient(circle at top, #222 0, var(--black-alt) 40%, var(--black) 100%);
      color: var(--white);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
    }

    header {
      flex: 0 0 auto;
      padding: 8px 12px;
      background: var(--black-alt);
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    header .brand { font-weight: bold; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); }
    header .status { font-size: 12px; opacity: .8; white-space: nowrap; }

    .tabs { display: flex; flex: 0 0 auto; background: #111; border-bottom: 1px solid #333; }
    .tab {
      flex: 1 1 0; min-width: 0; padding: 8px 4px; text-align: center;
      font-size: 13px; cursor: pointer; border-right: 1px solid #222;
      text-transform: uppercase; letter-spacing: .04em; touch-action: manipulation;
    }
    .tab:last-child { border-right: none; }
    .tab.active { background: var(--black-alt); color: var(--blue); font-weight: bold; }

    .chat-container {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      padding: 10px 12px; -webkit-overflow-scrolling: touch;
    }

    .message {
      margin-bottom: 9px; padding: 8px 9px; border-radius: 5px;
      background: var(--panel); border: 1px solid rgba(255,255,255,.07);
      font-size: 13px; position: relative;
    }
    .message .meta { font-size: 11px; opacity: .72; margin-bottom: 3px; }
    .message .username { color: var(--blue); font-weight: bold; }
    .message .content { white-space: pre-wrap; overflow-wrap: anywhere; }

    .message-reactions {
      display: flex; align-items: center; gap: 8px; margin-top: 9px; flex-wrap: wrap;
    }

    .reaction-btn {
      appearance: none;
      border: 1px solid #514329;
      border-bottom-width: 2px;
      background: linear-gradient(180deg, #29241b, #1d1a15);
      color: #f4e7ca;
      border-radius: 5px;
      padding: 5px 10px;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .045em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      touch-action: manipulation;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    }
    .reaction-btn:hover:not(:disabled) {
      border-color: var(--gold);
      background: linear-gradient(180deg, #393020, #272117);
    }
    .reaction-btn:active:not(:disabled) {
      transform: translateY(1px);
    }
    .reaction-btn:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }
    .reaction-btn[aria-pressed="true"] {
      color: #fff3d4;
      border-color: var(--gold);
      background: #49391e;
      box-shadow: inset 0 0 0 1px rgba(242,189,85,.18);
    }
    .reaction-btn:disabled {
      opacity: .72;
      cursor: default;
    }
    .reaction-btn svg {
      width: 14px; height: 14px; flex: 0 0 auto;
    }
    .reaction-btn.like svg { color: #9ed5de; }
    .reaction-btn.dislike svg { color: #e2a38d; }

    .reaction-count {
      min-width: 1ch;
      text-align: center;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }

    .reaction-hint {
      font-size: 10px;
      color: var(--muted);
    }

    .footer {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      padding: 8px 10px max(8px, env(safe-area-inset-bottom));
      background: var(--black-alt);
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .footer-top {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px;
    }
    #change-handle-btn { min-height: 36px; touch-action: manipulation; }

    .input-row { display: flex; gap: 6px; }
    .input-row input {
      flex: 1; min-width: 0; padding: 8px; border-radius: 3px; border: 1px solid #333;
      background: #111; color: var(--white); font-size: 16px;
    }

    .send-btn {
      padding: 6px 10px; border-radius: 3px; border: 1px solid var(--blue);
      background: var(--blue); color: var(--black); font-weight: bold; font-size: 16px;
      cursor: pointer; min-width: 80px; min-height: 40px; touch-action: manipulation;
    }
    .send-btn[disabled] { opacity: .5; cursor: not-allowed; }

    .cooldown { font-size: 11px; opacity: .7; min-height: 13px; }

    .toast {
      position: fixed; z-index: 1000; left: 50%; top: max(12px, env(safe-area-inset-top));
      width: min(calc(100vw - 32px), 520px); padding: 12px 16px;
      border: 1px solid #ff7777; border-radius: 6px; background: #351919; color: #fff;
      box-shadow: 0 6px 24px rgba(0,0,0,.45); text-align: center; font-size: 14px;
      line-height: 1.4; opacity: 0; transform: translate(-50%,-10px); pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .toast.visible { opacity: 1; transform: translate(-50%,0); }

    @media (max-width: 560px) {
      header { align-items: flex-start; }
      header .brand { font-size: 11px; letter-spacing: .04em; }
      header .status { font-size: 10px; }
      .tab { font-size: 10px; padding: 10px 5px; }
    }

    @media (prefers-reduced-motion: reduce) { .toast, .reaction-btn { transition: none; } }
  </style>
</head>

      }

      try {
        localStorage.setItem("shinyside_id", shinysideId);
      } catch {
        // ignore storage errors
      }

      setHandleDisplay();
    }

    function promptHandle() {
      const next = prompt("Choose your Shinyside ID (up to 30 characters):", shinysideId);
      if (next === null) return;

      const trimmed = next.trim();
      if (!trimmed) return;

      if (trimmed.length > 30) {
        showToast("Shinyside IDs must be 30 characters or fewer.");
        return;
      }

      if (!validateCommunityText(trimmed, "Your Shinyside ID")) return;

      shinysideId = trimmed;

      try {
        localStorage.setItem("shinyside_id", shinysideId);
      } catch {
        // ignore storage errors
      }

      setHandleDisplay();
    }

    function get24hCutoffISO() {
      return new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
    }

    function getMessageCounts(messageId) {
      return reactionTotals.get(String(messageId)) || { like: 0, dislike: 0 };
    }

    function updateReactionDisplay(messageId) {
      const id = String(messageId);
      const messageEl = chatEl.querySelector(`.message[data-id="${CSS.escape(id)}"]`);
      if (!messageEl) return;

      const counts = getMessageCounts(id);
      const likeCountEl = messageEl.querySelector('.reaction-count[data-reaction="like"]');
      const dislikeCountEl = messageEl.querySelector('.reaction-count[data-reaction="dislike"]');

      if (likeCountEl) likeCountEl.textContent = counts.like.toLocaleString();
      if (dislikeCountEl) dislikeCountEl.textContent = counts.dislike.toLocaleString();

      const messageReaction = localReactions[id];
      const alreadyReacted = messageReaction && messageReaction !== "pending";
      const selectedReaction = alreadyReacted ? messageReaction : null;

      messageEl.querySelectorAll(".reaction-btn").forEach(button => {
        const selected = selectedReaction === button.dataset.reaction;
        button.setAttribute("aria-pressed", String(selected));
        button.disabled = alreadyReacted || reactionPending.has(id);
        button.title = alreadyReacted
          ? "You already reacted to this message on this browser"
          : "One reaction per message on this browser";
      });

      const hint = messageEl.querySelector(".reaction-hint");
      if (hint) {
        hint.textContent = alreadyReacted ? "Your choice is saved here" : "Choose one";
      }
    }

    async function refreshReactions(messageIds) {
      const ids = [...new Set(messageIds.map(id => String(id)))];
      if (!ids.length) return;

      const totals = new Map(ids.map(id => [id, { like: 0, dislike: 0 }]));

      const pageSize = 1000;
      for (let offset = 0; ; offset += pageSize) {
        const { data, error } = await supabase
          .from("guestbook_message_reactions")
          .select("message_id, reaction")
          .in("message_id", ids)
          .range(offset, offset + pageSize - 1);

        if (error) throw error;

        for (const row of data || []) {
          const key = String(row.message_id);
          const counts = totals.get(key);
          if (!counts) continue;
          if (row.reaction === "like") counts.like += 1;
          if (row.reaction === "dislike") counts.dislike += 1;
        }

        if (!data || data.length < pageSize) break;
      }

      totals.forEach((counts, id) => reactionTotals.set(id, counts));
      ids.forEach(updateReactionDisplay);
    }

    function scheduleReactionRefresh(messageId) {
      const id = String(messageId);
      clearTimeout(reactionRefreshTimers.get(id));
      reactionRefreshTimers.set(id, setTimeout(() => {
        reactionRefreshTimers.delete(id);
        refreshReactions([id]).catch(error => console.error("Could not refresh reactions:", error));
      }, 160));
    }

    async function loadMessages() {
      const sequence = ++roomLoadSequence;
      chatEl.replaceChildren();

      const { data, error } = await supabase.from("guestbook_messages")
        .select("*")
        .eq("room", currentRoom)
        .eq("is_deleted", false)
        .gte("created_at", get24hCutoffISO())
        .order("created_at", { ascending: true });

      if (sequence !== roomLoadSequence) return;

      if (error) {
        console.error("Could not load messages:", error);
        statusEl.textContent = "Could not load messages";
        return;
      }

      const messages = data || [];
      messages.forEach(renderMessage);

      try {
        await refreshReactions(messages.map(msg => msg.id));
      } catch (reactionError) {
        console.error("Could not load reactions:", reactionError);
      }

      if (sequence === roomLoadSequence) {
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }

    async function maybePostDailyIcebreaker() {
      const { data, error } = await supabase.from("guestbook_messages")
        .select("id")
        .eq("room", currentRoom)
        .gte("created_at", get24hCutoffISO())
        .limit(1);

      if (!error && (!data || data.length === 0)) {
        const { error: insertError } = await supabase.from("guestbook_messages").insert({
          room: currentRoom,
          username: "ShinyBot",
          content: getRandomIcebreaker()
        });

        if (insertError) console.error("Could not post icebreaker:", insertError);
      }
    }

    const reactionIcons = {
      like: `
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 10v11H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3Zm0 0 5-8c1.5 0 2.5 1.2 2.2 2.7L13 10h5.2a2.5 2.5 0 0 1 2.4 3.2l-1.8 6A2.5 2.5 0 0 1 16.4 21H7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      `,
      dislike: `
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 14V3H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3Zm0 0 5 8c1.5 0 2.5-1.2 2.2-2.7L13 14h5.2a2.5 2.5 0 0 0 2.4-3.2l-1.8-6A2.5 2.5 0 0 0 16.4 3H7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      `
    };

    function renderMessage(msg) {
      const el = document.createElement("div");
      el.className = "message";
      el.dataset.id = String(msg.id);
      el.dataset.username = msg.username;

      const meta = document.createElement("div");
      meta.className = "meta";

      const username = document.createElement("span");
      username.className = "username";
      username.textContent = msg.username;

      const time = document.createElement("span");
      time.textContent = ` // ${new Date(msg.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;

      meta.append(username, time);

      const content = document.createElement("div");
      content.className = "content";
      content.textContent = msg.content;

      const reactions = document.createElement("div");
      reactions.className = "message-reactions";

      ["like", "dislike"].forEach(reaction => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `reaction-btn ${reaction}`;
        btn.dataset.messageId = String(msg.id);
        btn.dataset.reaction = reaction;
        btn.setAttribute("aria-label", reaction === "like" ? "Like this message" : "Dislike this message");
        btn.setAttribute("aria-pressed", "false");
        btn.innerHTML = `${reactionIcons[reaction]}<span>${reaction === "like" ? "LIKE" : "DISLIKE"}</span><span class=\"reaction-count\" data-reaction=\"${reaction}\">0</span>`;
        btn.addEventListener("click", () => submitReaction(msg.id, reaction));
        reactions.appendChild(btn);
      });

      const hint = document.createElement("span");
      hint.className = "reaction-hint";
      hint.textContent = "Choose one";

      reactions.appendChild(hint);

      el.append(meta, content, reactions);
      chatEl.appendChild(el);
      updateReactionDisplay(msg.id);
    }

    tabs.forEach(tab => tab.addEventListener("click", () => {
      tabs.forEach(item => item.classList.remove("active"));
      tab.classList.add("active");
      currentRoom = tab.dataset.room;
      loadMessages();
    }));

    window.addEventListener("storage", event => {
      if (event.key === REACTIONS_STORAGE_KEY) {
        localReactions = readLocalReactions();
        chatEl.querySelectorAll(".message").forEach(message => updateReactionDisplay(message.dataset.id));
      }
    });

    function subscribeRealtime() {
      supabase.channel("guestbook_channel")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "guestbook_messages" }, ({ new: msg }) => {
          if (msg.room === currentRoom && !msg.is_deleted && !chatEl.querySelector(`[data-id="${CSS.escape(String(msg.id))}"]`)) {
            renderMessage(msg);
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        })
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "guestbook_messages" }, ({ new: msg }) => {
          if (msg.is_deleted) {
            const el = chatEl.querySelector(`[data-id="${CSS.escape(String(msg.id))}"]`);
            if (el) el.remove();
          }
        })
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "guestbook_message_reactions" }, ({ new: reaction }) => {
          const messageExists = chatEl.querySelector(`.message[data-id="${CSS.escape(String(reaction.message_id))}"]`);
          if (messageExists) {
            scheduleReactionRefresh(reaction.message_id);
          }
        })
        .subscribe();
    }

    async function isUserBlocked(username) {
      const { data, error } = await supabase.from("blocked_handles").select("username")
        .eq("username", username)
        .gte("blocked_until", new Date().toISOString())
        .limit(1);

      if (error) throw error;
      return data && data.length > 0;
    }

    async function submitReaction(messageId, reaction) {
      const id = String(messageId);

      if (!messageId || isLocallyReacted(id) || reactionPending.has(id)) return;

      reactionPending.add(id);
      localReactions[id] = "pending";
      saveLocalReactions();
      updateReactionDisplay(id);

      try {
        const { error } = await supabase.from("guestbook_message_reactions").insert({
          message_id: messageId,
          reaction
        });

        if (error) throw error;

        localReactions[id] = reaction;
        saveLocalReactions();
        updateReactionDisplay(id);

        await refreshReactions([id]);
      } catch (error) {
        console.error("Could not add reaction:", error);
        delete localReactions[id];
        saveLocalReactions();
        updateReactionDisplay(id);
        showToast("This reaction could not be added. Please try again.");
      } finally {
        reactionPending.delete(id);
        updateReactionDisplay(id);
      }
    }

    async function sendMessage() {
      const content = messageInput.value.trim();

      if (!content || isSending || cooldownRemaining > 0) return;
      if (content.length > 500) {
        showToast("Messages must be 500 characters or fewer.");
        return;
      }
      if (!validateCommunityText(content, "Your message")) return;

      isSending = true;
      sendBtn.disabled = true;

      try {
        if (await isUserBlocked(shinysideId)) {
          showToast("You are muted for the rest of the day.");
          return;
        }

        const { error } = await supabase.from("guestbook_messages").insert({
          room: currentRoom,
          username: shinysideId,
          content
        });

        if (error) throw error;

        messageInput.value = "";
        startCooldown();
      } catch (error) {
        console.error("Could not send message:", error);

        const message = String(error?.message || "");
        if (/emoji/i.test(message)) {
          showToast("Emojis are not allowed. Please remove them and try again.");
        } else {
          showToast("Your message could not be sent. Please try again.");
        }
      } finally {
        isSending = false;
        sendBtn.disabled = cooldownRemaining > 0;
      }
    }

    function startCooldown() {
      clearInterval(cooldownTimer);
      cooldownRemaining = 10;
      sendBtn.disabled = true;
      cooldownText.textContent = `Cooldown: ${cooldownRemaining}s`;

      cooldownTimer = setInterval(() => {
        cooldownRemaining--;
        if (cooldownRemaining <= 0) {
          clearInterval(cooldownTimer);
          cooldownText.textContent = "";
          sendBtn.disabled = false;
        } else {
          cooldownText.textContent = `Cooldown: ${cooldownRemaining}s`;
        }
      }, 1000);
    }

    function adjustForKeyboard() {
      const viewport = window.visualViewport;
      const keyboardInset = viewport ? Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop) : 0;
      footer.style.transform = keyboardInset ? `translateY(-${keyboardInset}px)` : "";
      if (document.activeElement === messageInput && keyboardInset) {
        requestAnimationFrame(() => messageInput.scrollIntoView({ block: "nearest", behavior: "smooth" }));
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", adjustForKeyboard);
      window.visualViewport.addEventListener("scroll", adjustForKeyboard);
    }
    window.addEventListener("resize", adjustForKeyboard);

    (async function boot() {
      initHandle();
      await loadMessages();
      await maybePostDailyIcebreaker();
      subscribeRealtime();
      statusEl.textContent = "Connected";
      sendBtn.disabled = false;
    })();

    changeHandleBtn.addEventListener("click", promptHandle);
    sendBtn.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
