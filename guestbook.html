<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shiny Happy Guestbook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <style>
    :root { --blue:#00A9CE; --black:#0d0d0d; --black-alt:#161616; --white:#f3f3f3; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; overscroll-behavior:none; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
    body { font-family:"IBM Plex Mono",monospace; background:radial-gradient(circle at top,#222 0,var(--black-alt) 40%,var(--black) 100%); color:var(--white); display:flex; flex-direction:column; min-height:100vh; height:100vh; }
    header { padding:8px 12px; background:var(--black-alt); border-bottom:1px solid #333; display:flex; justify-content:space-between; align-items:center; font-size:14px; }
    header .brand { font-weight:bold; letter-spacing:.08em; text-transform:uppercase; color:var(--blue); }
    header .status { font-size:12px; opacity:.8; }
    .tabs { display:flex; background:#111; border-bottom:1px solid #333; }
    .tab { flex:1; padding:8px; text-align:center; font-size:13px; cursor:pointer; border-right:1px solid #222; text-transform:uppercase; letter-spacing:.06em; }
    .tab:last-child { border-right:none; }
    .tab.active { background:var(--black-alt); color:var(--blue); font-weight:bold; }
    .chat-container { flex:1; overflow-y:auto; padding:10px 12px 110px; -webkit-overflow-scrolling:touch; }
    .message { margin-bottom:8px; padding:6px 8px; border-radius:4px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.05); font-size:13px; position:relative; }
    .message .meta { font-size:11px; opacity:.7; margin-bottom:2px; }
    .message .username { color:var(--blue); font-weight:bold; }
    .message .content { white-space:pre-wrap; word-wrap:break-word; }
    .message .admin-actions { position:absolute; top:4px; right:6px; display:flex; gap:4px; }
    .admin-btn { font-size:10px; padding:2px 4px; border-radius:3px; border:1px solid #444; background:#111; color:var(--white); cursor:pointer; }
    .admin-btn.delete { border-color:#ff4b4b; color:#ffaaaa; }
    .admin-btn.block { border-color:#ffaa00; color:#ffdd99; }
    .footer { position:fixed; bottom:0; left:0; right:0; background:var(--black-alt); border-top:1px solid #333; padding:8px 10px; display:flex; flex-direction:column; gap:6px; z-index:10; }
    .footer-top { display:flex; justify-content:space-between; align-items:center; font-size:11px; gap:8px; }
    .input-row { display:flex; gap:6px; align-items:center; }
    .input-row input { flex:1; min-height:44px; padding:8px 10px; border-radius:3px; border:1px solid #333; background:#111; color:var(--white); font-size:16px; line-height:1.3; }
    .send-btn { padding:8px 12px; border-radius:3px; border:1px solid var(--blue); background:var(--blue); color:var(--black); font-weight:bold; font-size:13px; cursor:pointer; min-width:80px; min-height:44px; touch-action:manipulation; }
    .send-btn[disabled] { opacity:.5; cursor:not-allowed; }
    .cooldown { font-size:11px; opacity:.7; min-height:14px; }
    @media (max-width:480px) {
      header { padding:8px 10px; }
      header .brand { font-size:11px; letter-spacing:.04em; }
      .tabs { font-size:11px; }
      .tab { padding:10px 6px; font-size:11px; }
      .footer-top { flex-wrap:wrap; font-size:10px; }
      .footer { padding:8px; }
      .input-row input, .send-btn { min-height:46px; }
    }
  </style>
</head>
<body>
  <header><div class="brand">Shiny Happy Brewing // Guestbook</div><div class="status" id="status">Connecting…</div></header>
  <div class="tabs">
    <div class="tab active" data-room="main_lobby">📍 Main Lobby</div>
    <div class="tab" data-room="taproom">🍻 Taproom</div>
    <div class="tab" data-room="event_room">🎉 Event Room</div>
    <div class="tab" data-room="beer_garden">🌿 Beer Garden</div>
  </div>
  <div class="chat-container" id="chat"></div>
  <div class="footer">
    <div class="footer-top"><span id="handle-display"></span><button id="change-handle-btn">Change Shinyside ID</button></div>
    <div class="input-row"><input type="text" id="message-input" placeholder="Leave a note…" /><button class="send-btn" id="send-btn">Send</button></div>
    <div class="cooldown" id="cooldown-text"></div>
  </div>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://wowdmkxuwysuihgoklki.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_nlHqvZhnjR3PO-HsqgY2qw_aCw2yF4Y";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const chatEl = document.getElementById("chat");
    const tabs = document.querySelectorAll(".tab");
    const statusEl = document.getElementById("status");
    const handleDisplayEl = document.getElementById("handle-display");
    const changeHandleBtn = document.getElementById("change-handle-btn");
    const messageInput = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");
    const cooldownText = document.getElementById("cooldown-text");
    let currentRoom = "main_lobby";
    let shinysideId = null;
    let isAdmin = false;
    let cooldownTimer = null;
    let cooldownRemaining = 0;

    const ICEBREAKERS = [
      "What beer are you starting with today?",
      "If you could name a Shiny Happy beer, what would you call it?",
      "What’s the best thing you’ve done today?",
      "What band should we play next?",
      "What’s your go-to comfort food?",
      "What’s a random fun fact about you?",
      "If you could teleport anywhere right now, where would you go?",
      "What’s a movie you think everyone should watch?",
      "What’s your favorite fall activity?",
      "What’s something you’re looking forward to?"
    ];
    const MODERATION_BLOCKLIST = [
      "fuck","fuk","fucking","shit","bitch","asshole","dick","pussy","nigger","nigga",
      "coon","chink","beaner","whore","slut","rape","rapist","kill","stab","shoot","bomb",
      "hate","cunt","faggot","tranny","retard","incel","slur","threat"
    ];
    const getRandomIcebreaker = () => ICEBREAKERS[Math.floor(Math.random() * ICEBREAKERS.length)];

    function normalizeText(value) {
      return String(value || "").toLowerCase().normalize("NFKC").replace(/[\u200B-\u200D\uFEFF]/g, "").trim();
    }
    function escapeHtml(str) {
      return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");
    }
    function sanitizeHandle(value) {
      return String(value || "").replace(/[^a-zA-Z0-9._-]/g, "").replace(/\s+/g, "").trim().slice(0, 24);
    }
    function sanitizeMessage(value) {
      return String(value || "").replace(/\r/g, "").replace(/[\u0000-\u001F\u007F]/g, "").trim();
    }
    function containsModerationIssue(rawValue) {
      const text = normalizeText(rawValue);
      if (!text) return false;
      return MODERATION_BLOCKLIST.some(word => {
        const pattern = new RegExp(`\\b${word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\b`, "i");
        return pattern.test(text);
      });
    }
    function isSuspiciousHandle(handle) {
      const normalized = normalizeText(handle);
      if (!normalized || normalized.length < 2 || normalized.length > 24 || !/^[a-z0-9._-]+$/i.test(normalized)) return true;
      if (normalized.includes("admin") || normalized.includes("mod") || normalized.includes("bot")) return true;
      return containsModerationIssue(normalized);
    }
    function validateMessageContent(messageText, handleText) {
      const cleanMessage = sanitizeMessage(messageText);
      const cleanHandle = sanitizeHandle(handleText);
      if (!cleanMessage || cleanMessage.length > 300) return { ok:false, message:"Your message must be between 1 and 300 characters." };
      if (containsModerationIssue(cleanMessage) || containsModerationIssue(cleanHandle)) return { ok:false, message:"Please keep this community respectful. No profanity, hate, sexual, or threatening language." };
      if (isSuspiciousHandle(cleanHandle)) return { ok:false, message:"Choose a cleaner Shinyside ID with letters/numbers and no offensive language." };
      return { ok:true, message:cleanMessage, handle:cleanHandle };
    }
    function initHandle() {
      const stored = localStorage.getItem("shinyside_id");
      const fallback = "guest_" + Math.floor(Math.random() * 9999);
      const candidate = sanitizeHandle(stored || fallback);
      shinysideId = candidate && !isSuspiciousHandle(candidate) ? candidate : fallback;
      localStorage.setItem("shinyside_id", shinysideId);
      handleDisplayEl.textContent = "Shinyside ID: " + shinysideId;
    }
    function promptHandle() {
      const next = prompt("Choose your Shinyside ID:", shinysideId);
      if (!next) return;
      const cleaned = sanitizeHandle(next);
      if (!cleaned) { alert("Please enter a valid Shinyside ID."); return; }
      if (isSuspiciousHandle(cleaned)) { alert("That ID isn’t allowed. Please choose something respectful and clear."); return; }
      shinysideId = cleaned;
      localStorage.setItem("shinyside_id", shinysideId);
      handleDisplayEl.textContent = "Shinyside ID: " + shinysideId;
    }
    function initAdminMode() {
      const params = new URLSearchParams(window.location.search);
      isAdmin = params.get("admin") === "true";
      if (isAdmin) statusEl.textContent = "Connected // ADMIN MODE";
    }
    tabs.forEach(tab => tab.addEventListener("click", () => {
      tabs.forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentRoom = tab.dataset.room;
      loadMessages();
    }));
    const get24hCutoffISO = () => new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();

    async function loadMessages() {
      chatEl.innerHTML = "";
      const cutoff = get24hCutoffISO();
      const { data, error } = await supabase.from("guestbook_messages").select("*").eq("room", currentRoom).eq("is_deleted", false).gte("created_at", cutoff).order("created_at", { ascending:true });
      if (error) { console.error("Load messages failed:", error); statusEl.textContent = "Unable to load messages"; return; }
      (data || []).forEach(renderMessage);
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    async function maybePostDailyIcebreaker() {
      const cutoff = get24hCutoffISO();
      const { data } = await supabase.from("guestbook_messages").select("*").eq("room", currentRoom).gte("created_at", cutoff).limit(1);
      if (!data || data.length === 0) await supabase.from("guestbook_messages").insert({ room:currentRoom, username:"ShinyBot", content:getRandomIcebreaker() });
    }
    function renderMessage(msg) {
      if (chatEl.querySelector(`[data-id="${msg.id}"]`)) return;
      const el = document.createElement("div");
      el.className = "message";
      el.dataset.id = msg.id;
      el.dataset.username = msg.username;
      const meta = document.createElement("div");
      meta.className = "meta";
      const username = document.createElement("span");
      username.className = "username";
      username.textContent = escapeHtml(msg.username);
      const separator = document.createElement("span");
      separator.textContent = " // ";
      const time = document.createElement("span");
      time.textContent = new Date(msg.created_at).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
      meta.append(username, separator, time);
      const content = document.createElement("div");
      content.className = "content";
      content.textContent = msg.content;
      el.append(meta, content);
      if (isAdmin) {
        const actions = document.createElement("div");
        actions.className = "admin-actions";
        const del = document.createElement("button");
        del.className = "admin-btn delete";
        del.textContent = "Delete";
        del.onclick = () => adminDeleteMessage(msg.id);
        const block = document.createElement("button");
        block.className = "admin-btn block";
        block.textContent = "Block";
        block.onclick = () => adminBlockUser(msg.username);
        actions.append(del, block);
        el.appendChild(actions);
      }
      chatEl.appendChild(el);
    }
    function subscribeRealtime() {
      const channel = supabase.channel("guestbook_channel");
      channel.on("postgres_changes", { event:"INSERT", schema:"public", table:"guestbook_messages" }, payload => {
        const msg = payload.new;
        if (msg.room === currentRoom && !msg.is_deleted) { renderMessage(msg); chatEl.scrollTop = chatEl.scrollHeight; }
      });
      channel.on("postgres_changes", { event:"UPDATE", schema:"public", table:"guestbook_messages" }, payload => {
        const msg = payload.new;
        if (msg.is_deleted) { const el = chatEl.querySelector(`[data-id="${msg.id}"]`); if (el) el.remove(); }
      });
      channel.subscribe();
    }
    async function isUserBlocked(username) {
      const nowISO = new Date().toISOString();
      const { data } = await supabase.from("blocked_handles").select("*").eq("username", username).gte("blocked_until", nowISO).limit(1);
      return data && data.length > 0;
    }
    async function sendMessage() {
      const validation = validateMessageContent(messageInput.value, shinysideId);
      if (!validation.ok) { alert(validation.message); return; }
      if (await isUserBlocked(shinysideId)) { alert("You are muted for the rest of the day."); return; }
      sendBtn.disabled = true;
      try {
        const { error } = await supabase.from("guestbook_messages").insert({ room:currentRoom, username:validation.handle, content:validation.message });
        if (error) throw error;
        messageInput.value = "";
        startCooldown();
      } catch (error) {
        console.error("Send error:", error);
        alert("Your message could not be sent. Please try again.");
        sendBtn.disabled = false;
      }
    }
    function startCooldown() {
      clearInterval(cooldownTimer);
      cooldownRemaining = 10;
      cooldownText.textContent = `Cooldown: ${cooldownRemaining}s`;
      cooldownTimer = setInterval(() => {
        cooldownRemaining--;
        if (cooldownRemaining <= 0) { clearInterval(cooldownTimer); cooldownText.textContent = ""; sendBtn.disabled = false; }
        else cooldownText.textContent = `Cooldown: ${cooldownRemaining}s`;
      }, 1000);
    }
    async function adminDeleteMessage(id) {
      try {
        const res = await fetch("https://wowdmkxuwysuihgoklki.supabase.co/functions/v1/admin-delete-message", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({id}) });
        if (!res.ok) { console.error("Delete failed:", await res.text()); alert("Error deleting message"); return; }
        const el = document.querySelector(`[data-id="${id}"]`); if (el) el.remove();
      } catch (err) { console.error("Delete error:", err); alert("Error deleting message"); }
    }
    async function adminBlockUser(username) {
      try {
        const res = await fetch("https://wowdmkxuwysuihgoklki.supabase.co/functions/v1/admin-block-user", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({username}) });
        if (!res.ok) { console.error("Block failed:", await res.text()); alert("Error blocking user"); return; }
        document.querySelectorAll(".message").forEach(el => { if (el.dataset.username === username) el.remove(); });
      } catch (err) { console.error("Block error:", err); alert("Error blocking user"); }
    }
    (async function boot() {
      initHandle();
      initAdminMode();
      await loadMessages();
      await maybePostDailyIcebreaker();
      subscribeRealtime();
      if (!statusEl.textContent.includes("Unable")) statusEl.textContent = "Connected";
      sendBtn.disabled = false;
    })();
    changeHandleBtn.addEventListener("click", promptHandle);
    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keydown", event => {
      if (event.key === "Enter") { event.preventDefault(); sendMessage(); }
    });
  </script>
</body>
</html>
