<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shiny Happy Guestbook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <style>
    :root {
      --blue: #00A9CE;
      --black: #0d0d0d;
      --black-alt: #161616;
      --white: #f3f3f3;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      background: radial-gradient(circle at top, #222 0, var(--black-alt) 40%, var(--black) 100%);
      color: var(--white);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
    }
    header {
      flex: 0 0 auto;
      padding: 8px 12px;
      background: var(--black-alt);
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    header .brand { font-weight: bold; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue); }
    header .status { font-size: 12px; opacity: 0.8; white-space: nowrap; }
    .tabs { display: flex; flex: 0 0 auto; background: #111; border-bottom: 1px solid #333; }
    .tab {
      flex: 1 1 0;
      min-width: 0;
      padding: 8px 4px;
      text-align: center;
      font-size: 13px;
      cursor: pointer;
      border-right: 1px solid #222;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      touch-action: manipulation;
    }
    .tab:last-child { border-right: none; }
    .tab.active { background: var(--black-alt); color: var(--blue); font-weight: bold; }
    .chat-container {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 10px 12px;
      -webkit-overflow-scrolling: touch;
    }
    .message {
      margin-bottom: 8px;
      padding: 6px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
      position: relative;
    }
    .message .meta { font-size: 11px; opacity: 0.7; margin-bottom: 2px; }
    .message .username { color: var(--blue); font-weight: bold; }
    .message .content { white-space: pre-wrap; overflow-wrap: anywhere; }
    .footer {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      padding: 8px 10px max(8px, env(safe-area-inset-bottom));
      background: var(--black-alt);
      border-top: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .footer-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; }
    #change-handle-btn { min-height: 36px; touch-action: manipulation; }
    .input-row { display: flex; gap: 6px; }
    .input-row input {
      flex: 1;
      min-width: 0;
      padding: 8px;
      border-radius: 3px;
      border: 1px solid #333;
      background: #111;
      color: var(--white);
      font-size: 16px; /* 16px prevents iOS Safari focus zoom. */
    }
    .send-btn {
      padding: 6px 10px;
      border-radius: 3px;
      border: 1px solid var(--blue);
      background: var(--blue);
      color: var(--black);
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      min-width: 80px;
      min-height: 40px;
      touch-action: manipulation;
    }
    .send-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
    .cooldown { font-size: 11px; opacity: 0.7; min-height: 13px; }
    .toast {
      position: fixed;
      z-index: 1000;
      left: 50%;
      top: max(12px, env(safe-area-inset-top));
      width: min(calc(100vw - 32px), 520px);
      padding: 12px 16px;
      border: 1px solid #ff7777;
      border-radius: 6px;
      background: #351919;
      color: #fff;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
      opacity: 0;
      transform: translate(-50%, -10px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 560px) {
      header { align-items: flex-start; }
      header .brand { font-size: 11px; letter-spacing: 0.04em; }
      header .status { font-size: 10px; }
      .tab { font-size: 10px; padding: 10px 5px; }
    }
    @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  </style>
</head>

    function showToast(message, duration = 3500) {
      clearTimeout(toastTimer);
      toastEl.textContent = message;
      toastEl.classList.add("visible");
      toastTimer = setTimeout(() => toastEl.classList.remove("visible"), duration);
    }

    function normalizeForModeration(value) {
      return String(value || "")
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[0]/g, "o")
        .replace(/[@]/g, "a")
        .replace(/[1!|]/g, "i")
        .replace(/[3]/g, "e")
        .replace(/[4]/g, "a")
        .replace(/[5$]/g, "s")
        .replace(/[7+]/g, "t")
        .replace(/[8]/g, "b")
        .replace(/[\u200B-\u200D\uFEFF\uFE0E\uFE0F]/g, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function containsBlockedContent(value) {
      const normalized = normalizeForModeration(value);
      if (!normalized) return false;

      return blockedTerms.some(term => {
        const normalizedTerm = normalizeForModeration(term);
        if (!normalizedTerm) return false;
        // Boundaries prevent "ass" from matching words like "class". Allow
        // punctuation/spacing between letters to catch simple obfuscations.
        const pattern = normalizedTerm
          .split(/\s+/)
          .map(word => [...word].join("[^a-z0-9]*"))
          .join("[^a-z0-9]+");
        return new RegExp(`(^|[^a-z0-9])${pattern}($|[^a-z0-9])`, "i").test(normalized);
      });
    }

    function validateCommunityText(value, label) {
      if (containsBlockedContent(value)) {
        showToast(`${label} contains language that isn't allowed. Please rephrase it respectfully.`);
        return false;
      }
      return true;
    }

    function setHandleDisplay() {
      handleDisplayEl.textContent = "Shinyside ID: " + shinysideId;
    }

    function initHandle() {
      const stored = localStorage.getItem("shinyside_id");
      shinysideId = stored || "guest_" + Math.floor(Math.random() * 9999);
      if (containsBlockedContent(shinysideId)) shinysideId = "guest_" + Math.floor(Math.random() * 9999);
      localStorage.setItem("shinyside_id", shinysideId);
      setHandleDisplay();
    }

    function promptHandle() {
      const next = prompt("Choose your Shinyside ID (up to 30 characters):", shinysideId);
      if (next === null) return;
      const trimmed = next.trim();
      if (!trimmed) return;
      if (trimmed.length > 30) {
        showToast("Shinyside IDs must be 30 characters or fewer.");
        return;
      }
      if (!validateCommunityText(trimmed, "Your Shinyside ID")) return;
      shinysideId = trimmed;
      localStorage.setItem("shinyside_id", shinysideId);
      setHandleDisplay();
    }


    tabs.forEach(tab => tab.addEventListener("click", () => {
      tabs.forEach(item => item.classList.remove("active"));
      tab.classList.add("active");
      currentRoom = tab.dataset.room;
      loadMessages();
    }));

    const get24hCutoffISO = () => new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();

    async function loadMessages() {
      chatEl.replaceChildren();
      const { data, error } = await supabase.from("guestbook_messages")
        .select("*").eq("room", currentRoom).eq("is_deleted", false)
        .gte("created_at", get24hCutoffISO()).order("created_at", { ascending: true });
      if (error) {
        console.error("Could not load messages:", error);
        return;
      }
      (data || []).forEach(renderMessage);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function maybePostDailyIcebreaker() {
      const { data, error } = await supabase.from("guestbook_messages")
        .select("id").eq("room", currentRoom).gte("created_at", get24hCutoffISO()).limit(1);
      if (!error && (!data || data.length === 0)) {
        const { error: insertError } = await supabase.from("guestbook_messages").insert({
          room: currentRoom, username: "ShinyBot", content: getRandomIcebreaker()
        });
        if (insertError) console.error("Could not post icebreaker:", insertError);
      }
    }

    function renderMessage(msg) {
      const el = document.createElement("div");
      el.className = "message";
      el.dataset.id = msg.id;
      el.dataset.username = msg.username;
      const meta = document.createElement("div");
      meta.className = "meta";
      const username = document.createElement("span");
      username.className = "username";
      username.textContent = msg.username;
      const time = document.createElement("span");
      time.textContent = ` // ${new Date(msg.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
      meta.append(username, time);
      const content = document.createElement("div");
      content.className = "content";
      content.textContent = msg.content;
      el.append(meta, content);

      chatEl.appendChild(el);
    }

    function subscribeRealtime() {
      supabase.channel("guestbook_channel")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "guestbook_messages" }, ({ new: msg }) => {
          if (msg.room === currentRoom && !msg.is_deleted && !chatEl.querySelector(`[data-id="${CSS.escape(String(msg.id))}"]`)) {
            renderMessage(msg);
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        })
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "guestbook_messages" }, ({ new: msg }) => {
          if (msg.is_deleted) {
            const el = chatEl.querySelector(`[data-id="${CSS.escape(String(msg.id))}"]`);
            if (el) el.remove();
          }
        }).subscribe();
    }

    async function isUserBlocked(username) {
      const { data, error } = await supabase.from("blocked_handles").select("username")
        .eq("username", username).gte("blocked_until", new Date().toISOString()).limit(1);
      if (error) throw error;
      return data && data.length > 0;
    }

    async function sendMessage() {
      const content = messageInput.value.trim();
      if (!content || isSending || cooldownRemaining > 0) return;
      if (content.length > 500) {
        showToast("Messages must be 500 characters or fewer.");
        return;
      }
      if (!validateCommunityText(content, "Your message")) return;

      isSending = true;
      sendBtn.disabled = true;
      try {
        if (await isUserBlocked(shinysideId)) {
          showToast("You are muted for the rest of the day.");
          return;
        }
        const { error } = await supabase.from("guestbook_messages").insert({
          room: currentRoom, username: shinysideId, content
        });
        if (error) throw error;
        messageInput.value = "";
        startCooldown();
      } catch (error) {
        console.error("Could not send message:", error);
        showToast("Your message could not be sent. Please try again.");
      } finally {
        isSending = false;
        sendBtn.disabled = cooldownRemaining > 0;
      }
    }

    function startCooldown() {
      clearInterval(cooldownTimer);
      cooldownRemaining = 10;
      sendBtn.disabled = true;
      cooldownText.textContent = `Cooldown: ${cooldownRemaining}s`;
      cooldownTimer = setInterval(() => {
        cooldownRemaining--;
        if (cooldownRemaining <= 0) {
          clearInterval(cooldownTimer);
          cooldownText.textContent = "";
          sendBtn.disabled = false;
        } else {
          cooldownText.textContent = `Cooldown: ${cooldownRemaining}s`;
        }
      }, 1000);
    }

    function adjustForKeyboard() {
      const viewport = window.visualViewport;
      const keyboardInset = viewport ? Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop) : 0;
      footer.style.transform = keyboardInset ? `translateY(-${keyboardInset}px)` : "";
      if (document.activeElement === messageInput && keyboardInset) {
        requestAnimationFrame(() => messageInput.scrollIntoView({ block: "nearest", behavior: "smooth" }));
      }
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", adjustForKeyboard);
      window.visualViewport.addEventListener("scroll", adjustForKeyboard);
    }
    window.addEventListener("resize", adjustForKeyboard);

    (async function boot() {
      initHandle();
      await loadMessages();
      await maybePostDailyIcebreaker();
      subscribeRealtime();
      statusEl.textContent = "Connected";
      sendBtn.disabled = false;
    })();

    changeHandleBtn.addEventListener("click", promptHandle);
    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>

</html>
