  <style>
    :root { --blue:#107098; --gold:#c27e3a; --silver:#dfe3e7; --white:#fff; --paper:#f5f5f5; --ink:#111; --muted:#666; }
    * { box-sizing:border-box; }
    html,body { width:100%;height:100%;margin:0; }
    body { font-family:Inter,Arial,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column;min-height:100vh;min-height:100dvh; }
    header { flex:0 0 auto;text-align:center;background:var(--white);border-bottom:1px solid var(--silver);padding:14px 18px 12px; }
    .brand { display:flex;flex-direction:column;align-items:center;line-height:1; }
    .brand-script { font:italic 600 clamp(2rem,5vw,3rem) "Playfair Display",Georgia,serif;transform:rotate(-7deg);margin:0 0 4px; }
    .brand-happy { font-size:clamp(2rem,7vw,3.8rem);font-weight:700;letter-spacing:.24em;padding-left:.24em; }

    .title { margin:15px 0 4px;font:600 clamp(1.35rem,4vw,2rem) "Playfair Display",Georgia,serif; }
    .tagline { color:var(--blue);font-size:.77rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600; }
    main { flex:1 1 auto;min-height:0;display:flex;flex-direction:column;max-width:980px;width:100%;margin:0 auto;background:var(--paper); }
    #status { padding:9px 16px;text-align:center;color:var(--muted);font-size:.78rem;border-bottom:1px solid rgba(0,0,0,.06); }
    #chat { flex:1 1 auto;min-height:180px;overflow-y:auto;padding:14px 16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch; }
    .message { margin-bottom:10px;padding:12px 14px;background:var(--white);border:1px solid rgba(0,0,0,.08);border-left:3px solid var(--blue);border-radius:8px;box-shadow:0 3px 12px rgba(0,0,0,.035); }
    .meta { display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:7px;color:var(--muted);font-size:.73rem; }
    .username { color:var(--blue);font-weight:700;letter-spacing:.04em; }
    .content { white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:.95rem; }
    .footer { flex:0 0 auto;background:var(--white);border-top:1px solid var(--silver);padding:12px max(14px, calc((100% - 948px)/2)) max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px; }
    .footer-top { display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.78rem; }
    #handle-display { color:var(--muted); }
    button { font:inherit;touch-action:manipulation;cursor:pointer; }
    #change-handle-btn { border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:4px;padding:8px 11px;font-weight:600; }
    .input-row { display:flex;gap:8px; }
    #message-input { flex:1;min-width:0;padding:11px 12px;border:1px solid #d5d9dc;border-radius:5px;background:#fff;color:var(--ink);font:inherit;font-size:16px; }
    #send-btn { min-width:84px;min-height:42px;border:0;border-radius:5px;background:var(--blue);color:#fff;font-weight:700;padding:8px 14px; }
    #send-btn:disabled { opacity:.5;cursor:not-allowed; }
    #cooldown-text { min-height:14px;color:var(--gold);font-size:.75rem; }
    #toast { position:fixed;z-index:5;left:50%;top:max(12px,env(safe-area-inset-top));width:min(calc(100vw - 28px),520px);padding:12px 15px;transform:translate(-50%,-10px);opacity:0;pointer-events:none;text-align:center;border:1px solid #c77979;border-radius:6px;background:#fff1f1;color:#752222;box-shadow:0 5px 20px #0002;transition:opacity .16s,transform .16s; }
    #toast.visible { opacity:1;transform:translate(-50%,0); }
    @media(max-width:560px) { header{padding:12px 10px}.brand-events{letter-spacing:.35em}.footer{padding-left:10px;padding-right:10px}.input-row{gap:6px}#send-btn{min-width:72px} }
    @media(prefers-reduced-motion:reduce) { #toast{transition:none} }
  </style>

<body>

  </main>
  <footer class="footer">
    <div class="footer-top"><span id="handle-display">Choose an ID before posting</span><button id="change-handle-btn" type="button">Choose / Change ID</button></div>
    <div class="input-row"><input type="text" id="message-input" placeholder="Leave a note…" maxlength="500" autocomplete="off" disabled /><button id="send-btn" type="button" disabled>Send</button></div>
    <div id="cooldown-text" aria-live="polite"></div>
  </footer>
  <div id="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <script type="module">

      "porn","porno","pornography","xxx","nsfw","nude","nudes","naked pics","send nudes","sex tape","blowjob","handjob","rimjob","deepthroat","orgasm","masturbate","masturbation","cumshot","semen","dildo","vibrator","hentai","onlyfans","hook up","hookup","suck my","show me your body","send me pics","sexual favors","sexual favor","rape","molest","groping","pedo","pedophile","child porn","underage sex","incest","prostitute","milf","anal sex","pussy","threesome","sexual assault","sexually assault","anal","blow job","hand job","rim job","sextape","deep throat","blow me","suck me","butthole","ass hole","butt hole","cum",
      "kill yourself","kys","go kill yourself","end your life","you should die","i hope you die","i will kill","i'll kill","ill kill","im going to kill","i am going to kill","kill you","shoot you","stab you","bomb threat","blow you up","burn your house","i will hurt you","i'll hurt you","death threat","hang yourself","cut yourself","self harm","suicide is the answer","murder you","beat you up","go die","dead","die","suicide",
      "nazi","nazis","heil hitler","white power","white supremacy","white supremacist","gas the jews","gas jews","jews control","jewish control","race war","ethnic cleansing","racial purity","go back to your country","go back where you came from","you don't belong here","all muslims are terrorists","all immigrants are criminals","immigrants are vermin","deport all","ethnic inferiority","ethnicity","deport","naz1","naz1s",
      "nigger","niggers","nigga","niggas","niggah","niggaz","chink","chinks","gook","gooks","spic","spics","wetback","wetbacks","kike","kikes","raghead","ragheads","towelhead","towelheads","paki","pakis","coon","coons","porch monkey","sand nigger","jigaboo","beaner","beaners","zipperhead","faggot","faggots","dyke","tranny","shemale","retard","retarded","n1gger","nigg3r","n1gg3r","n1gga","n1ggah","n1ggaz","fagg","fag","twink","fairy","butch","sandnigger","sandnigga","sandniggah","sandn1gger","sandnigg3r","sandn1gga","sandn1ggah","sandniggers","sandniggas","sandniggahs","sandn1gg3r","sandn1ggas","sandn1ggahs","heeb","retards","fags","faggs","fairies",
      "joder","jodido","jodida","mierda","puta","puto","putas","putos","coño","cabron","cabrón","pendejo","pendeja","chingar","chingada","chingado","chingas a tu madre","vete a la mierda","maricon","maricón","negro de mierda","mono de mierda","te voy a matar","ojala te mueras","ojalá te mueras",
      "merde","putain","connard","connasse","enculé","encule","salope","nique ta mère","nique ta mere","va te faire foutre","sale arabe","sale juif","je vais te tuer",
      "scheisse","scheiße","arschloch","fick dich","hurensohn","hure","schlampe","schwuchtel","kanake","verpiss dich","ich bring dich um","judensau",
      "porra","caralho","foda-se","fodase","vai se foder","filho da puta","macaco","vou te matar","se mata","cazzo","vaffanculo","stronzo","troia","figlio di puttana","negro di merda","ti ammazzo","kanker","kankerlijer","tering","klootzak","tyfuslijer","neger","ik maak je dood",
      "worthless piece of","you are disgusting","nobody likes you","shut up loser","you are ugly","stupid bitch","dumb bitch","fat pig","subhuman","vermin","filthy animal","rape you","i want to rape","will rape"
    ];

    function showToast(message, duration = 3500) {
      clearTimeout(toastTimer);
      toastEl.textContent = message;
      toastEl.classList.add("visible");
      toastTimer = setTimeout(() => toastEl.classList.remove("visible"), duration);
    }

    function normalizeForModeration(value) {
      return String(value || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
        .replace(/[0]/g,"o").replace(/[@]/g,"a").replace(/[1!|]/g,"i").replace(/[3]/g,"e")
        .replace(/[4]/g,"a").replace(/[5$]/g,"s").replace(/[7+]/g,"t").replace(/[8]/g,"b")
        .replace(/[\u200B-\u200D\uFEFF\uFE0E\uFE0F]/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
    }

    function containsBlockedContent(value) {
      const normalized = normalizeForModeration(value);
      if (!normalized) return false;
      return blockedTerms.some(term => {
        const normalizedTerm = normalizeForModeration(term);
        if (!normalizedTerm) return false;
        const pattern = normalizedTerm.split(/\s+/).map(word => [...word].join("[^a-z0-9]*")).join("[^a-z0-9]+");
        return new RegExp(`(^|[^a-z0-9])${pattern}($|[^a-z0-9])`, "i").test(normalized);
      });
    }

    function validateCommunityText(value, label) {
      if (containsBlockedContent(value)) {
        showToast(`${label} contains language that isn't allowed. Please rephrase it respectfully.`);
        return false;
      }
      return true;
    }

    function updateIdentity() {
      handleDisplayEl.textContent = shinysideId ? `Shinyside ID: ${shinysideId}` : "Choose an ID before posting";
      messageInput.disabled = !shinysideId;
      sendBtn.disabled = !shinysideId || cooldownRemaining > 0;
    }

    function chooseId() {
      const next = window.prompt("Choose your Shinyside ID (up to 30 characters):", shinysideId || "");
      if (next === null) return;
      const trimmed = next.trim();
      if (!trimmed) { showToast("Please choose an ID before posting."); return; }
      if (trimmed.length > 30) { showToast("Shinyside IDs must be 30 characters or fewer."); return; }
      if (!validateCommunityText(trimmed, "Your Shinyside ID")) return;
      shinysideId = trimmed;
      localStorage.setItem(storageKey, shinysideId);
      updateIdentity();
    }

    function renderMessage(msg) {
      const el = document.createElement("article");
      el.className = "message";
      el.dataset.id = String(msg.id);
      const meta = document.createElement("div");
      meta.className = "meta";
      const username = document.createElement("span");
      username.className = "username";
      username.textContent = msg.username;
      const stamp = document.createElement("time");
      stamp.dateTime = msg.created_at;
      stamp.textContent = `• ${new Date(msg.created_at).toLocaleString([], { dateStyle:"medium", timeStyle:"short" })}`;
      meta.append(username, stamp);
      const content = document.createElement("div");
      content.className = "content";
      content.textContent = msg.content;
      el.append(meta, content);
      chatEl.appendChild(el);
    }

    async function loadMessages() {
      chatEl.replaceChildren();
      const { data, error } = await supabase.from("events_guestbook_messages")
        .select("id,username,content,created_at,is_deleted").eq("is_deleted", false)
        .order("created_at", { ascending: true }).limit(500);
      if (error) {
        console.error("Could not load Events guestbook messages:", error);
        statusEl.textContent = "Could not load messages. Please refresh to try again.";
        return;
      }
      (data || []).forEach(renderMessage);
      statusEl.textContent = "Gather. Celebrate. Belong.";
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function subscribeRealtime() {
      supabase.channel("events_guestbook_channel")
        .on("postgres_changes", { event:"INSERT", schema:"public", table:"events_guestbook_messages" }, ({ new: msg }) => {
          if (!msg.is_deleted && !chatEl.querySelector(`[data-id="${CSS.escape(String(msg.id))}"]`)) {
            renderMessage(msg);
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        })
        .on("postgres_changes", { event:"UPDATE", schema:"public", table:"events_guestbook_messages" }, ({ new: msg }) => {
          if (msg.is_deleted) chatEl.querySelector(`[data-id="${CSS.escape(String(msg.id))}"]`)?.remove();
        }).subscribe();
    }

    function startCooldown() {
      clearInterval(cooldownTimer);
      cooldownRemaining = 10;
      cooldownText.textContent = `Cooldown: ${cooldownRemaining}s`;
      updateIdentity();
      cooldownTimer = setInterval(() => {
        cooldownRemaining -= 1;
        if (cooldownRemaining <= 0) {
          clearInterval(cooldownTimer);
          cooldownText.textContent = "";
          updateIdentity();
        } else cooldownText.textContent = `Cooldown: ${cooldownRemaining}s`;
      }, 1000);
    }

    async function sendMessage() {
      const content = messageInput.value.trim();
      if (!shinysideId) { showToast("Choose an ID before posting."); return; }
      if (!content || isSending || cooldownRemaining > 0) return;
      if (content.length > 500) { showToast("Messages must be 500 characters or fewer."); return; }
      if (!validateCommunityText(content, "Your message")) return;
      isSending = true;
      sendBtn.disabled = true;
      try {
        const { error } = await supabase.from("events_guestbook_messages").insert({ username:shinysideId, content });
        if (error) throw error;
        messageInput.value = "";
        startCooldown();
      } catch (error) {
        console.error("Could not send Events guestbook message:", error);
        showToast("Your message could not be sent. Please try again.");
      } finally {
        isSending = false;
        sendBtn.disabled = !shinysideId || cooldownRemaining > 0;
      }
    }

    changeHandleBtn.addEventListener("click", chooseId);
    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keydown", event => {
      if (event.key === "Enter") { event.preventDefault(); sendMessage(); }
    });

    (async function boot() {
      const stored = localStorage.getItem(storageKey);
      if (stored && stored.length <= 30 && !containsBlockedContent(stored)) shinysideId = stored;
      updateIdentity();
      await loadMessages();
      subscribeRealtime();
      if (!shinysideId) chooseId();
    })();
  </script>
</body>
</html>
